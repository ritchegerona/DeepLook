[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deeplook"
version = "1.0.0"
description = "Advanced terminal OSINT & threat intelligence framework for CTIA and security professionals"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "Ritche Gerona", email = "ritchegerona@users.noreply.github.com"}
]
keywords = [
    "osint",
    "threat-intelligence",
    "recon",
    "cybersecurity",
    "ctia",
    "infosec",
    "security",
    "investigation",
    "digital-forensics",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Information Technology",
    "Intended Audience :: Education",
    "Topic :: Security",
    "Topic :: System :: Networking",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "typer>=0.12.0",
    "rich>=13.0.0",
    "requests>=2.31.0",
    "python-whois>=0.9.0",
    "dnspython>=2.4.0",
    "stix2>=3.0.0",
    "networkx>=3.2",
    "aiohttp>=3.9.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.1.0",
    "cryptography>=42.0.0",
    "openpyxl>=3.1.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
gui = [
    "streamlit>=1.36",
    "pyvis>=0.3",
    "pandas>=2.0",
]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.3.0",
    "responses>=0.24",
]

[project.urls]
Homepage = "https://github.com/ritchegerona/DeepLook"
Documentation = "https://github.com/ritchegerona/DeepLook/tree/main/docs"
Repository = "https://github.com/ritchegerona/DeepLook"
Issues = "https://github.com/ritchegerona/DeepLook/issues"

[project.scripts]
deeplook = "deeplook.cli:app"

[tool.setuptools.packages.find]
include = ["deeplook*"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["deeplook"]
branch = true
omit = [
    "deeplook/gui/*",
    "deeplook/__main__.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 34
exclude_lines = [
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
